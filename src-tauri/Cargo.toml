[package]
name = "scope"
version = "0.1.6"
description = "See, update, and uninstall every app on your Linux system — all in one place"
authors = ["Khurram"]
edition = "2021"

[lib]
name = "scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "rt-multi-thread", "time", "macros", "sync"] }
anyhow = "1"
walkdir = "2"
glob = "0.3"
regex = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Runtime optimization for shipped builds. Thin LTO keeps release builds
# tractable in CI while still enabling cross-crate inlining.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
