name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: check, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            squashfs-tools \
            file \
            curl \
            jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build release binary for AppImage
        run: cargo build --release --locked

      - name: Download linuxdeploy
        run: |
          curl -fsSL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - name: Build AppImage
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "scope-gpui") | .version')"
          .github/scripts/build-appimage.sh "$VERSION" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - name: Validate AppImage contents
        run: |
          APPIMAGE="Scope-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "scope-gpui") | .version')-x86_64.AppImage"
          mkdir -p "$RUNNER_TEMP/appimage-check"
          (
            cd "$RUNNER_TEMP/appimage-check"
            "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract
          )
          APPDIR="$RUNNER_TEMP/appimage-check/squashfs-root"
          test -x "$APPDIR/AppRun"
          test -f "$APPDIR/.DirIcon"
          test -f "$APPDIR/scope.desktop"
          test -x "$APPDIR/usr/bin/scope-gpui"
          file "$APPDIR/.DirIcon" | grep -F 'PNG image data, 256 x 256'
