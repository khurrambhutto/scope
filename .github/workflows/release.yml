name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build & Release (GPUI .deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            curl \
            jq \
            dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package .deb (.deb first per product scope)
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PKGDIR="pkg/scope_${VERSION}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" \
            "$PKGDIR/usr/bin" \
            "$PKGDIR/usr/share/applications" \
            "$PKGDIR/usr/share/icons/hicolor/scalable/apps" \
            "$PKGDIR/usr/share/doc/scope"
          cp target/release/scope-gpui "$PKGDIR/usr/bin/scope"
          chmod 755 "$PKGDIR/usr/bin/scope"
          cp assets/scope-logo.svg "$PKGDIR/usr/share/icons/hicolor/scalable/apps/scope.svg"
          cat > "$PKGDIR/usr/share/applications/scope.desktop" << 'EOF'
          [Desktop Entry]
          Name=Scope
          Comment=See, update, and uninstall every app in one place
          Exec=/usr/bin/scope
          Icon=scope
          Terminal=false
          Type=Application
          Categories=Utility;System;PackageManager;
          EOF
          cat > "$PKGDIR/DEBIAN/control" << EOF
          Package: scope
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Scope Maintainers
          Description: See, update, and uninstall every app on your Linux system in one place.
           Unifies APT, Snap, Flatpak, and AppImage with preview-first operations.
          EOF
          echo "Scope ${VERSION} (GPUI shell)" > "$PKGDIR/usr/share/doc/scope/changelog"
          dpkg-deb --build "$PKGDIR"
          ls -la ./*.deb pkg/*.deb 2>/dev/null || true
          mv "$PKGDIR.deb" "scope_${VERSION}_amd64.deb"
          ls -la scope_${VERSION}_amd64.deb

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Scope ${{ github.ref_name }} (GPUI)"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            scope_*_amd64.deb
