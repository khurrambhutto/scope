name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build & Release (.deb)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            curl \
            jq \
            minisign \
            dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "scope-gpui") | .version')"
          test "$TAG_VERSION" = "$CARGO_VERSION" || {
            echo "tag version $TAG_VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          }

      - name: Build release binary
        env:
          SCOPE_UPDATE_PUBLIC_KEY: ${{ vars.SCOPE_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$SCOPE_UPDATE_PUBLIC_KEY" || {
            echo "SCOPE_UPDATE_PUBLIC_KEY is not configured" >&2
            exit 1
          }
          cargo build --release --locked

      - name: Package .deb (.deb first per product scope)
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PKGDIR="pkg/scope_${VERSION}_amd64"
          mkdir -p "$PKGDIR/DEBIAN" \
            "$PKGDIR/usr/bin" \
            "$PKGDIR/usr/share/applications" \
            "$PKGDIR/usr/share/icons/hicolor/scalable/apps" \
            "$PKGDIR/usr/share/doc/scope"
          cp target/release/scope-gpui "$PKGDIR/usr/bin/scope"
          chmod 755 "$PKGDIR/usr/bin/scope"
          cp assets/scope-logo.svg "$PKGDIR/usr/share/icons/hicolor/scalable/apps/scope.svg"
          cat > "$PKGDIR/usr/share/applications/scope.desktop" << 'EOF'
          [Desktop Entry]
          Name=Scope
          Comment=See, update, and uninstall every app in one place
          Exec=/usr/bin/scope
          Icon=scope
          Terminal=false
          Type=Application
          Categories=Utility;System;PackageManager;
          EOF
          cat > "$PKGDIR/DEBIAN/control" << EOF
          Package: scope
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Scope Maintainers
          Description: See, update, and uninstall every app on your Linux system in one place.
           Unifies APT, Snap, Flatpak, and AppImage with preview-first operations.
          EOF
          echo "Scope ${VERSION}" > "$PKGDIR/usr/share/doc/scope/changelog"
          dpkg-deb --build "$PKGDIR"
          ls -la ./*.deb pkg/*.deb 2>/dev/null || true
          mv "$PKGDIR.deb" "scope_${VERSION}_amd64.deb"
          ls -la scope_${VERSION}_amd64.deb

      - name: Sign release checksums
        env:
          SCOPE_UPDATE_SECRET_KEY: ${{ secrets.SCOPE_UPDATE_SECRET_KEY }}
          SCOPE_UPDATE_PUBLIC_KEY: ${{ vars.SCOPE_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$SCOPE_UPDATE_SECRET_KEY" || {
            echo "SCOPE_UPDATE_SECRET_KEY is not configured" >&2
            exit 1
          }
          umask 077
          printf '%s\n' "$SCOPE_UPDATE_SECRET_KEY" > "$RUNNER_TEMP/scope-minisign.key"
          sha256sum scope_*_amd64.deb > SHA256SUMS
          minisign -S -s "$RUNNER_TEMP/scope-minisign.key" -m SHA256SUMS -x SHA256SUMS.minisig
          printf '%s\n' "$SCOPE_UPDATE_PUBLIC_KEY" > "$RUNNER_TEMP/scope-minisign.pub"
          minisign -V -p "$RUNNER_TEMP/scope-minisign.pub" -m SHA256SUMS -x SHA256SUMS.minisig
          sha256sum --check SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Scope ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            scope_*_amd64.deb
            SHA256SUMS
            SHA256SUMS.minisig
