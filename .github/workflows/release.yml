name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles deb rpm appimage

      - name: Generate latest.json
        run: |
          RELEASE_DIR="src-tauri/target/release/bundle"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          APPIMAGE=$(ls "$RELEASE_DIR"/appimage/*.AppImage 2>/dev/null | head -1)
          DEB=$(ls "$RELEASE_DIR"/deb/*.deb 2>/dev/null | head -1)
          RPM=$(ls "$RELEASE_DIR"/rpm/*.rpm 2>/dev/null | head -1)

          # Every self-update target must exist and be signed, otherwise
          # installs of that format would silently fall back or fail.
          for f in "$APPIMAGE" "$DEB" "$RPM"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "Missing bundle artifact (found appimage='$APPIMAGE' deb='$DEB' rpm='$RPM')"
              exit 1
            fi
            if [ ! -f "$f.sig" ]; then
              echo "Missing updater signature for $f"
              exit 1
            fi
          done

          APPIMAGE_NAME=$(basename "$APPIMAGE")
          DEB_NAME=$(basename "$DEB")
          RPM_NAME=$(basename "$RPM")
          RELEASE_BASE="https://github.com/khurrambhutto/scope/releases/download/${TAG}"

          APPIMAGE_SIGNATURE=$(cat "$APPIMAGE.sig")
          DEB_SIGNATURE=$(cat "$DEB.sig")
          RPM_SIGNATURE=$(cat "$RPM.sig")

          # Platform keys: the updater looks up "{os}-{arch}-{bundle_type}"
          # first (linux-x86_64-deb / -rpm / -appimage) and falls back to
          # "linux-x86_64", which is kept on the AppImage for older installs.
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See full release notes: https://github.com/khurrambhutto/scope/releases/tag/${TAG}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "linux-x86_64-deb": {
                "signature": "${DEB_SIGNATURE}",
                "url": "${RELEASE_BASE}/${DEB_NAME}"
              },
              "linux-x86_64-rpm": {
                "signature": "${RPM_SIGNATURE}",
                "url": "${RELEASE_BASE}/${RPM_NAME}"
              },
              "linux-x86_64-appimage": {
                "signature": "${APPIMAGE_SIGNATURE}",
                "url": "${RELEASE_BASE}/${APPIMAGE_NAME}"
              },
              "linux-x86_64": {
                "signature": "${APPIMAGE_SIGNATURE}",
                "url": "${RELEASE_BASE}/${APPIMAGE_NAME}"
              }
            }
          }
          EOF

          jq . latest.json > /dev/null
          echo "Generated latest.json:"
          cat latest.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Scope ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            latest.json
