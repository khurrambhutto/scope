[package]
name = "scope-gtk"
version = "0.1.8"
edition = "2021"
description = "Scope — see, update, and uninstall every app on your Linux system (GTK4 frontend)"
license = "MIT"

[[bin]]
name = "scope-gtk"
path = "src/main.rs"

[dependencies]
# Native UI
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

# Shared backend logic (also required by the #[path]-included core modules)
tokio = { version = "1", features = ["process", "fs", "io-util", "rt-multi-thread", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
walkdir = "2"
glob = "0.3"
regex = "1"

# Tokio -> GLib main loop bridge
async-channel = "2"
