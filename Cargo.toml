[package]
name = "scope-gpui"
version = "0.3.4"
edition = "2021"
description = "See, update, and uninstall Linux apps in one place"

[[bin]]
name = "scope-gpui"
path = "src/main.rs"

[dependencies]
# UI framework via GPUI Kit (brings the pinned gpui-pre snapshot; do not
# list gpui separately). On Linux this needs libxkbcommon-x11-dev etc.
gpui-kit = "0.7"

# Shared backend: the exact same modules the Tauri shell compiles, pulled in
# with #[path] so there is a single source of truth (see src/backend.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "fs", "rt", "time", "macros", "sync", "io-util"] }
walkdir = "2"
regex = "1"
futures = "0.3"
unicode-segmentation = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
minisign-verify = "0.3"

[lints.rust]
# The shell is safe, idiomatic Rust; shared backend modules included.
unsafe_code = "forbid"

[lints.clippy]
# Start from clippy's default set and make every warning fatal, so CI and
# `cargo clippy -- -D warnings` agree.
all = { level = "deny", priority = 10 }
# No half-finished states may ship in either shell.
dbg_macro = { level = "deny", priority = 11 }
todo = { level = "deny", priority = 11 }
unimplemented = { level = "deny", priority = 11 }
# Apollo rust-best-practices §2.3 recommendations.
redundant_clone = { level = "deny", priority = 9 }
needless_collect = { level = "deny", priority = 9 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Per gpui-kit installation docs: dev builds leave the framework
# unoptimized and feel sluggish. Optimize framework deps in dev while
# keeping our own code debuggable. Slows the first compile, not required.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
