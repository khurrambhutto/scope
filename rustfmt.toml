# Scope formatting rules.
#
# The import-grouping options are unstable: nightly rustfmt (`cargo +nightly
# fmt`) honours them, stable rustfmt ignores them with a warning. They follow
# Apollo rust-best-practices §1.7 (std, external crates, then crate-local).
reorder_imports = true
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
